# .github/workflows/workbuddy-checkin.yml
name: WorkBuddy 自动签到

on:
  schedule:
    # 北京时间 08:00, 12:00, 23:00 各执行一次
    - cron: '0 0,4,15 * * *'
  workflow_dispatch:  # 支持手动触发

# 保活提交需要写权限（否则 git push 会 403）
permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行签到脚本
        env:
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python workbuddy_checkin.py

      # 防休眠保活：每 45 天自动提交一次，防止 GitHub 停用定时任务
      - name: 保活提交
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date > .keepalive
          git add .keepalive
          git diff --quiet && git diff --staged --quiet || git commit -m "keepalive $(date)"
          git push
